    --accent:#B98A2E; --accent-soft:#F6ECD3; --ocean:#2F6E6A; --ocean-soft:#E3F0EE;

      --plum:#D79FCB; --plum-soft:#3A2438; --sky:#7FAEDD; --sky-soft:#1C2C3D;
      --rose:#E08A93; --rose-soft:#3A2226; --danger:#E4907C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1A1C; --surface:#152325; --surface-2:#1C2C2F; --ink:#E7EEED; --ink-soft:#B7C6C4;
    --muted:#8CA09E; --line:#2A3D40; --primary:#8FC4CE; --primary-soft:#1A3238;
    --accent:#E2B75C; --accent-soft:#3A2F1B; --ocean:#74BFB5; --ocean-soft:#1B322F;
    --plum:#D79FCB; --plum-soft:#3A2438; --sky:#7FAEDD; --sky-soft:#1C2C3D;
    --rose:#E08A93; --rose-soft:#3A2226; --danger:#E4907C;

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-feature-settings:"tnum" 1; }

  header.top{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;

  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand .mark{ font-family:var(--serif); font-weight:700; font-size:15px; color:var(--surface);
    background:var(--primary); padding:5px 9px 4px; border-radius:6px; letter-spacing:.04em; }
  h1{ font-family:var(--serif); font-weight:700; font-size:26px; margin:0; letter-spacing:.01em; text-wrap:balance; }
  header.top .meta{ font-size:12.5px; color:var(--muted); text-align:right; line-height:1.7; }
  header.top .meta b{ color:var(--ink-soft); font-weight:600; }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--primary);
    color:var(--primary);
    background:var(--primary-soft);
    font-family:var(--sans);
    font-weight:700;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    text-decoration:none;
    white-space:nowrap;
    margin-bottom:14px;
    transition:background .15s ease, color .15s ease;
  }
  .back-link:hover{ background:var(--primary); color:var(--surface); }

  .nav-btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--primary); color:var(--primary); background:var(--primary-soft);
    font-family:var(--sans); font-weight:700; font-size:13px;
    padding:8px 16px; border-radius:999px; text-decoration:none; white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{ background:var(--primary); color:var(--surface); }
  .nav-btn::after{ content:"→"; }

  .search-box{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:11px 14px; margin-bottom:16px; box-shadow:var(--shadow); }
  .search-box svg{ flex:none; opacity:.55; }
  .search-box input{ border:none; background:transparent; outline:none; font-family:var(--sans); font-size:15px; color:var(--ink); width:100%; }
  .search-box input::placeholder{ color:var(--muted); }

  .tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; }
  .tabs button{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    font-family:var(--sans); font-weight:600; font-size:13.5px; padding:8px 16px; border-radius:999px; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease; }
  .tabs button:hover{ border-color:var(--primary); color:var(--primary); }
  .tabs button.active{ background:var(--primary); border-color:var(--primary); color:var(--surface); }

  .subtabs{ display:flex; flex-wrap:wrap; gap:6px; margin:-10px 0 20px; }
  .subtabs:empty{ margin:0; }
  .subtabs button{ appearance:none; border:1px dashed var(--line); background:var(--surface-2); color:var(--muted);
    font-family:var(--sans); font-weight:600; font-size:12.5px; padding:6px 13px; border-radius:999px; cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease; }
  .subtabs button:hover{ border-color:var(--ocean); color:var(--ocean); }
  .subtabs button::before{ content:"↳ "; }

  @keyframes anchor-flash{
    0%{ box-shadow:0 0 0 3px var(--ocean); }
    100%{ box-shadow:0 1px 2px rgba(23,38,42,.06), 0 8px 24px -12px rgba(23,38,42,.22); }
  }
  .anchor-flash{ animation:anchor-flash 1.1s ease-out; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

  .floor-block{ margin-bottom:22px; }
  .floor-heading{ font-family:var(--serif); font-weight:700; font-size:17px; color:var(--primary);
    background:var(--primary-soft); display:inline-block; padding:4px 14px; border-radius:999px; margin:0 0 12px; }

  .dir-card{ padding:16px 18px 18px; margin-bottom:14px; }
  .dir-card-title{ font-family:var(--serif); font-weight:700; font-size:15px; margin:0 0 10px; color:var(--ink); }
  .dir-row{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px dashed var(--line); font-size:14px; }
  .dir-row:first-of-type{ border-top:none; }
  .dir-row .who{ color:var(--ink-soft); }
  .dir-row .ext{ color:var(--primary); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dir-row .who .tag{ font-size:10.5px; color:var(--accent); background:var(--accent-soft); border-radius:4px; padding:0 5px; margin-left:6px; font-weight:700; }
  .dir-card.phone-card{ background:var(--surface-2); box-shadow:none; border:1px dashed var(--line); padding:12px 16px 13px; }
  .dir-card.phone-card .dir-card-title{ font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  .seat-panel{ padding:16px 18px 20px; margin-bottom:14px; }
  .seat-office-title{ font-family:var(--serif); font-weight:700; font-size:15px; margin:0 0 4px; color:var(--ink); }
  .seat-office-sub{ font-size:12px; color:var(--muted); margin:0 0 14px; }
  .seat-row-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin:12px 0 8px; }
  .seat-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
  .seat-zone{ display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .seat-desk{ min-width:88px; padding:6px 9px; text-align:center; }
  .seat-desk + .seat-desk{ border-left:1px dashed var(--line); }
  .seat-ext{ font-family:var(--serif); font-weight:700; font-size:13px; color:var(--primary);

  .seat-desk-people.row{ display:flex; flex-direction:row; gap:8px; justify-content:center; }
  .seat-desk-people.row .seat-person{ min-width:44px; }
  .seat-person{ font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .seat-person .tag{ display:block; font-size:10px; color:var(--accent); font-weight:700; }

    text-decoration-style:dotted;
    text-decoration-color:currentColor;

  .teacher-link:hover{ color:var(--ocean); }

  .empty-hint{ color:var(--muted); font-size:13.5px; padding:18px 4px; text-align:center; }

  .class-grid{ display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin-bottom:16px; }
  .pill-btn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);

  .pill-btn:hover{ border-color:var(--primary); color:var(--primary); }
  .pill-btn.active{ background:var(--primary); border-color:var(--primary); color:var(--surface); }
  .class-info{ padding:16px 18px 18px; }

  .class-info .row{ font-size:14px; color:var(--ink-soft); padding:4px 0; }
  .class-info .row b{ color:var(--ink); }
  .class-info .jump{ display:inline-block; margin-top:10px; font-size:13px; color:var(--primary); text-decoration:underline dotted; cursor:pointer; }

  table.search-table{ width:100%; border-collapse:collapse; }
  table.search-table th, table.search-table td{ border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; font-size:13.5px; }
  table.search-table th{ color:var(--muted); font-weight:700; font-size:12px; }
  table.search-table td.ext{ color:var(--primary); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }

  footer.foot{ margin-top:26px; font-size:12px; color:var(--muted); text-align:center; }

    .wrap{ padding:16px 12px 48px; }

    .nav-btn{ font-size:14px; padding:10px 16px; }
    h1{ font-size:20px; }
    .search-box input{ font-size:16px; }
    .tabs button{ padding:10px 14px; font-size:14px; }
    .class-grid{ grid-template-columns:repeat(4, 1fr); }
    .pill-btn{ padding:12px 4px; font-size:15px; }
    .seat-desk{ min-width:74px; font-size:13px; }
    .dir-row{ font-size:15px; }
  }
</style>

function extNum(s){ const m = (s||"").match(/\d{3}/); return m ? m[0] : (s||""); }
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function personLabel(r){
  let label = r.姓名;
  let tag = "";
  const m = r.處室別.match(/^(\d+)班導師$/);
  if(m) tag = m[1]+"班導師";
  return {name:label, tag};
}

// 判斷一個姓名字串（可能帶「職稱 」前綴或「（備註）」後綴）裡，
// 是否包含一個能對應到課表系統教師代碼的姓名片段。
function matchTeacherCode(fullName){
  if(TEACHER_CODE_BY_NAME[fullName]) return {code:TEACHER_CODE_BY_NAME[fullName], name:fullName};
  const stripped = fullName.replace(/（[^）]*）\s*$/, "");
  if(stripped !== fullName && TEACHER_CODE_BY_NAME[stripped]) return {code:TEACHER_CODE_BY_NAME[stripped], name:stripped};
  const idx = fullName.lastIndexOf(" ");
  if(idx >= 0){
    const tail = fullName.slice(idx + 1);
    if(TEACHER_CODE_BY_NAME[tail]) return {code:TEACHER_CODE_BY_NAME[tail], name:tail};
  }
  return null;
}

// 把姓名字串輸出成 HTML：若能對應到課表系統的教師，姓名的部分會變成連結
// （前綴職稱／後綴備註維持純文字），點擊會開啟課表查詢頁該教師的課表。
function personNameHtml(fullName){
  const m = matchTeacherCode(fullName);
  if(!m) return escapeHtml(fullName);
  const idx = fullName.indexOf(m.name);
  const before = fullName.slice(0, idx);
  const after = fullName.slice(idx + m.name.length);
  return escapeHtml(before) +
    `<a class="teacher-link" href="index.html?teacher=${encodeURIComponent(m.code)}">${escapeHtml(m.name)}</a>` +
    escapeHtml(after);
}

function renderSeatOffice(office, anchor){
  const cfg = SEAT_LAYOUT[office];
  let html = `<div class="panel seat-panel"${anchor ? ` data-anchor="${escapeHtml(anchor)}"` : ""}>
    <p class="seat-office-title">${escapeHtml(office)}</p>
    <p class="seat-office-sub">依現場座位配置繪製，方框內數字為分機號碼</p>`;
  cfg.rows.forEach(row => {
    html += `<div class="seat-row-label">${escapeHtml(row.label)}</div><div class="seat-row">`;
    row.zones.forEach(zone => {
      html += `<div class="seat-zone">`;
      zone.desks.forEach(desk => {
        html += `<div class="seat-desk"><div class="seat-ext">${desk.ext}</div><div class="seat-desk-people ${row.orientation}">`;
        if(desk.people.length === 0){
          html += `<div class="seat-person" style="color:var(--muted)">（無資料）</div>`;
        } else {
          desk.people.forEach(name => {
            const r = nameMap[name];
            const {name:label, tag} = r ? personLabel(r) : {name, tag:""};
            html += `<div class="seat-person">${personNameHtml(label)}${tag ? `<span class="tag">${escapeHtml(tag)}</span>` : ""}</div>`;
          });
        }
        html += `</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

// ROSTER_OVERRIDE 讓特定 office 卡片改用明確指定的姓名清單（含順序），
// 透過 nameMap 找回這些人，清單內同時混合一般人員與已併入班導師的人員也沒問題。

function renderDirCard(office, rows, anchor){
  const isPhoneLine = office === "各處室專線電話";
  const overrideNames = anchor && ROSTER_OVERRIDE[anchor];
  const list = overrideNames ? overrideNames.map(n => nameMap[n]).filter(Boolean) : rows;
  let html = `<div class="panel dir-card${isPhoneLine ? " phone-card" : ""}"${anchor ? ` data-anchor="${escapeHtml(anchor)}"` : ""}><p class="dir-card-title">${escapeHtml(office)}${isPhoneLine ? "（直撥線）" : ""}</p>`;
  list.forEach(r => {
    const {name, tag} = personLabel(r);
    html += `<div class="dir-row"><span class="who">${personNameHtml(name)}${tag ? `<span class="tag">${escapeHtml(tag)}</span>` : ""}</span><span class="ext">${escapeHtml(r.分機) || "—"}</span></div>`;
  });
  html += `</div>`;
  return html;
}

function renderClassTab(){

  classRows.sort((a,b) => a.處室別.localeCompare(b.處室別, "zh-Hant-u-nu-latn", {numeric:true}));
  let html = `<div class="class-grid">`;
  classRows.forEach(r => {
    const cls = r.處室別.replace("班導師","");
    html += `<button class="pill-btn" data-class="${cls}">${cls}</button>`;
  });
  html += `</div><div id="classInfo"></div>`;
  return html;
}

function showClassInfo(cls){
  const r = DB.find(x => x.處室別 === cls+"班導師");
  const box = document.getElementById('classInfo');
  if(!r || !box) return;
  box.innerHTML = `<div class="panel class-info">
    <h3>${cls} 班導師</h3>
    <div class="row">導師：<b>${personNameHtml(r.姓名)}</b></div>
    <div class="row">分機：<b>${escapeHtml(r.分機) || "—"}</b></div>
    <div class="row">座位：<b>${escapeHtml(r.建築物)} ${escapeHtml(r.樓層)}</b>${r.座位分區 ? `（${escapeHtml(r.座位分區)}）` : ""}</div>
    ${r.建築物 && BUILDINGS.includes(r.建築物) ? `<span class="jump" data-jump="${escapeHtml(r.建築物)}">查看 ${escapeHtml(r.建築物)} 座位圖 →</span>` : ""}
  </div>`;
  box.querySelector('.jump')?.addEventListener('click', e => {
    activeTab = e.target.dataset.jump;
    renderTabs(); renderSubTabs(); renderContent();
    window.scrollTo({top:0, behavior:"smooth"});
  });
}

function renderBuildingTab(building){
  const rows = DB.filter(r => r.建築物 === building && !/^\d+班導師$/.test(r.處室別));
  if(rows.length === 0) return `<p class="empty-hint">此建築物暫無資料</p>`;
  const floors = [...new Set(rows.map(r => r.樓層))].sort((a,b) => (FLOOR_ORDER[a]??9) - (FLOOR_ORDER[b]??9));
  let html = "";
  floors.forEach(floor => {
    const floorRows = rows.filter(r => r.樓層 === floor);
    // 依「相鄰且處室別相同」切成一段一段，保留原始資料順序
    // （不能用 Set 去重分組，否則同名的「各處室專線電話」會被合併到同一張卡片）
    const segments = [];
    floorRows.forEach(r => {
      const last = segments[segments.length - 1];
      if(last && last.office === r.處室別){
        last.rows.push(r);
      } else {
        segments.push({ office:r.處室別, rows:[r] });
      }
    });
    html += `<div class="floor-block" data-anchor="${escapeHtml("floor:"+building+":"+floor)}">`;
    if(floor) html += `<p class="floor-heading">${escapeHtml(building)}・${escapeHtml(floor)}</p>`;
    segments.forEach(seg => {
      const anchor = "office:"+building+":"+floor+":"+seg.office;
      if(SEAT_LAYOUT[seg.office]){
        html += renderSeatOffice(seg.office, anchor);
      } else {
        html += renderDirCard(seg.office, seg.rows, anchor);
      }
    });
    html += `</div>`;
  });
  return html;
}

function renderSearchResults(query){
  const q = query.trim().toLowerCase();
  const results = DB.filter(r =>
    r.姓名.toLowerCase().includes(q) ||
    r.分機.toLowerCase().includes(q) ||
    r.處室別.toLowerCase().includes(q) ||
    r.建築物.toLowerCase().includes(q)
  );
  if(results.length === 0) return `<p class="empty-hint">找不到符合「${escapeHtml(query)}」的資料</p>`;
  let html = `<div class="panel dir-card"><table class="search-table"><thead><tr>
    <th>建築物</th><th>樓層</th><th>處室別</th><th>姓名</th><th>分機</th></tr></thead><tbody>`;
  results.forEach(r => {
    html += `<tr><td>${escapeHtml(r.建築物)}</td><td>${escapeHtml(r.樓層)}</td><td>${escapeHtml(r.處室別)}</td><td>${personNameHtml(r.姓名)}</td><td class="ext">${escapeHtml(r.分機)||"—"}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function renderTabs(){
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = BUILDINGS.map(b => `<button class="${b===activeTab?"active":""}" data-b="${escapeHtml(b)}">${escapeHtml(b)}</button>`).join("");
  wrap.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.b;
      document.getElementById('searchInput').value = "";
      renderTabs(); renderSubTabs(); renderContent();
    });
  });
}

function renderSubTabs(){
  const wrap = document.getElementById('subTabsWrap');
  const jumps = QUICK_JUMPS[activeTab];
  if(!jumps){ wrap.innerHTML = ""; return; }
  wrap.innerHTML = jumps.map(j => `<button data-target="${escapeHtml(j.target)}">${escapeHtml(j.label)}</button>`).join("");
  wrap.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const el = document.querySelector(`[data-anchor="${CSS.escape(btn.dataset.target)}"]`);
      if(!el) return;
      el.scrollIntoView({behavior:"smooth", block:"start"});
      el.classList.remove('anchor-flash');
      void el.offsetWidth;
      el.classList.add('anchor-flash');
    });
  });
}

function renderContent(){
  const content = document.getElementById('content');
  const q = document.getElementById('searchInput').value;
  if(q.trim()){
    document.getElementById('subTabsWrap').innerHTML = "";
    content.innerHTML = renderSearchResults(q);
    return;
  }
  renderSubTabs();
  if(activeTab === "班級導師"){
    content.innerHTML = renderClassTab();
    content.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        content.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showClassInfo(btn.dataset.class);
      });
    });
  } else {
    content.innerHTML = renderBuildingTab(activeTab);
  }
}

document.getElementById('searchInput').addEventListener('input', renderContent);

renderTabs();
renderSubTabs();
renderContent();
