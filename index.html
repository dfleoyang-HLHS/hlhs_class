<title>花蓮高中課表查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#F3F6F5;
    --surface:#FFFFFF;
    --surface-2:#EAF0EF;
    --ink:#17262A;
    --ink-soft:#435456;
    --muted:#6C7C7C;
    --line:#D6E0DE;
    --primary:#17384A;
    --primary-soft:#E7EEEF;
    --accent:#B98A2E;
    --accent-soft:#F6ECD3;
    --ocean:#2F6E6A;
    --ocean-soft:#E3F0EE;
    --plum:#7D4E74;
    --plum-soft:#F1E4EE;
    --danger:#B14B3D;
    --shadow:0 1px 2px rgba(23,38,42,.06), 0 8px 24px -12px rgba(23,38,42,.22);
    --radius:10px;
    --serif:"Noto Serif TC", "Songti TC", serif;
    --sans:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1A1C;
      --surface:#152325;
      --surface-2:#1C2C2F;
      --ink:#E7EEED;
      --ink-soft:#B7C6C4;
      --muted:#8CA09E;
      --line:#2A3D40;
      --primary:#8FC4CE;
      --primary-soft:#1A3238;
      --accent:#E2B75C;
      --accent-soft:#3A2F1B;
      --ocean:#74BFB5;
      --ocean-soft:#1B322F;
      --plum:#D79FCB;
      --plum-soft:#3A2438;
      --danger:#E4907C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1A1C;
    --surface:#152325;
    --surface-2:#1C2C2F;
    --ink:#E7EEED;
    --ink-soft:#B7C6C4;
    --muted:#8CA09E;
    --line:#2A3D40;
    --primary:#8FC4CE;
    --primary-soft:#1A3238;
    --accent:#E2B75C;
    --accent-soft:#3A2F1B;
    --ocean:#74BFB5;
    --ocean-soft:#1B322F;
    --danger:#E4907C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-feature-settings:"tnum" 1;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 64px;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand .mark{
    font-family:var(--serif);
    font-weight:700;
    font-size:15px;
    color:var(--surface);
    background:var(--primary);
    padding:5px 9px 4px;
    border-radius:6px;
    letter-spacing:.04em;
  }
  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  header.top .meta{
    font-size:12.5px;
    color:var(--muted);
    text-align:right;
    line-height:1.7;
  }
  header.top .meta b{color:var(--ink-soft); font-weight:600;}

  .tabs{
    display:inline-flex;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    margin-bottom:18px;
  }
  .tabs button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    padding:8px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tabs button.active{
    background:var(--primary);
    color:var(--surface);
  }
  .tabs button:not(.active):hover{ background:var(--surface); }

  .layout{
    display:grid;
    grid-template-columns:270px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{ grid-template-columns:1fr; }
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .sidebar{ padding:14px; position:sticky; top:16px; }
  @media (max-width:760px){ .sidebar{ position:static; } }
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:12px;
  }
  .search-box svg{ flex:none; opacity:.55; }
  .search-box input{
    border:none;
    background:transparent;
    outline:none;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    width:100%;
  }
  .search-box input::placeholder{ color:var(--muted); }

  .group-label{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.09em;
    color:var(--muted);
    text-transform:uppercase;
    margin:14px 4px 6px;
  }
  .group-label:first-of-type{ margin-top:2px; }

  .class-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
  }
  .pill-btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:var(--sans);
    font-weight:600;
    font-size:13.5px;
    padding:8px 4px;
    border-radius:7px;
    cursor:pointer;
    text-align:center;
    font-variant-numeric:tabular-nums;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .pill-btn:hover{ border-color:var(--primary); color:var(--primary); }
  .pill-btn.active{
    background:var(--primary);
    border-color:var(--primary);
    color:var(--surface);
  }

  .teacher-list{
    max-height:560px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:4px;
  }
  .teacher-row{
    appearance:none;
    border:none;
    background:transparent;
    text-align:left;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
    font-family:var(--sans);
    font-size:13.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
    gap:8px;
  }
  .teacher-row .code{ color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .teacher-row:hover{ background:var(--surface-2); }
  .teacher-row.active{ background:var(--primary); color:var(--surface); }
  .teacher-row.active .code{ color:var(--primary-soft); }
  .empty-hint{ color:var(--muted); font-size:13px; padding:10px 6px; }

  .main{ padding:22px 22px 26px; min-width:0; }
  .main-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .entity-title{ display:flex; align-items:baseline; gap:10px; }
  .entity-title .code-tag{
    font-family:var(--serif);
    font-weight:700;
    font-size:13px;
    color:var(--primary);
    background:var(--primary-soft);
    padding:3px 9px;
    border-radius:6px;
    font-variant-numeric:tabular-nums;
  }
  .entity-title h2{
    font-family:var(--serif);
    font-size:22px;
    font-weight:700;
    margin:0;
  }
  .stats{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat-chip{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .stat-chip b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .table-scroll{ overflow-x:auto; border-radius:8px; border:1px solid var(--line); }
  table.timetable{
    border-collapse:collapse;
    width:100%;
    min-width:640px;
    background:var(--surface);
  }
  table.timetable th, table.timetable td{
    border:1px solid var(--line);
    vertical-align:top;
  }
  table.timetable thead th{
    background:var(--surface-2);
    font-family:var(--sans);
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    padding:9px 4px;
    text-align:center;
    letter-spacing:.02em;
  }
  table.timetable thead th.today{ color:var(--primary); background:var(--primary-soft); }
  table.timetable td.period-col{
    background:var(--surface-2);
    text-align:center;
    font-family:var(--serif);
    font-weight:600;
    color:var(--ink-soft);
    font-size:13px;
    width:52px;
    padding:6px 2px;
  }
  table.timetable td.period-col span{ display:block; font-size:10.5px; color:var(--muted); font-weight:500; margin-top:1px; }
  table.timetable td.slot{
    padding:0;
    min-width:118px;
  }
  table.timetable td.slot.today-col{ background:color-mix(in srgb, var(--primary-soft) 55%, transparent); }
  .cell-empty{ height:100%; min-height:44px; }
  .cell-inner{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:7px 8px;
  }
  .entry{
    border-left:3px solid var(--primary);
    background:var(--primary-soft);
    border-radius:5px;
    padding:5px 7px;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .entry.co{
    border-left-color:var(--ocean);
    background:var(--ocean-soft);
  }
  .entry .subject{
    font-weight:700;
    font-size:13px;
    color:var(--ink);
    line-height:1.25;
  }
  .entry .sub-line{
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.3;
  }
  .entry .sub-line .link{
    cursor:pointer;
    text-decoration-line:underline;
    text-decoration-style:dotted;
    text-decoration-color:currentColor;
    text-underline-offset:2px;
    border-radius:3px;
  }
  .entry .sub-line .link:hover{ color:var(--primary); }
  .entry .sub-line .link:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }
  .entry .tag{
    display:inline-block;
    margin-top:2px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ocean);
    background:var(--surface);
    border:1px solid var(--ocean);
    border-radius:4px;
    padding:0 4px;
    width:fit-content;
  }

  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
  }
  .legend .sw{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .legend .dot{
    width:10px; height:10px; border-radius:3px; display:inline-block;
  }
  .dot.own{ background:var(--primary); }
  .dot.co{ background:var(--ocean); }

  .groups-panel{
    margin-top:20px;
    padding:20px 22px 22px;
  }
  .groups-heading{
    font-family:var(--serif);
    font-weight:700;
    font-size:18px;
    margin:0 0 4px;
  }
  .groups-sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 18px;
    line-height:1.6;
  }
  .group-card{
    border-left:4px solid var(--gc, var(--primary));
    background:var(--surface-2);
    border-radius:8px;
    padding:14px 16px 16px;
  }
  .group-card + .group-card{ margin-top:14px; }
  .group-card-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px 10px;
    margin-bottom:12px;
  }
  .group-card-title{
    font-family:var(--serif);
    font-weight:700;
    font-size:15px;
    color:var(--gc, var(--primary));
    margin:0;
  }
  .group-card-note{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--gc, var(--primary));
    background:var(--gc-soft, var(--primary-soft));
    border-radius:999px;
    padding:2px 10px;
  }
  .group-class-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:10px;
  }
  .group-class-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px 11px;
  }
  .group-class-card .class-code-link{
    display:inline-block;
    font-family:var(--serif);
    font-weight:700;
    font-size:13.5px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .group-track-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    font-size:12px;
    padding:3px 0;
    border-top:1px dashed var(--line);
  }
  .group-track-row:first-of-type{ border-top:none; }
  .group-track-chip{
    flex:none;
    background:var(--gc-soft, var(--primary-soft));
    color:var(--gc, var(--primary));
    border-radius:4px;
    padding:1px 6px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }
  .group-track-detail{
    flex:1;
    text-align:right;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .group-track-detail .room{ color:var(--muted); }

  footer.foot{
    margin-top:26px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* Phone-tier refinements: tighter spacing, bigger touch targets, a
     narrower (but still swipeable) timetable so less horizontal scroll
     is needed on a typical 360-430px phone screen. */
  @media (max-width:640px){
    .wrap{ padding:16px 12px 44px; }
    header.top{ padding-bottom:14px; margin-bottom:16px; }
    header.top .meta{ text-align:left; width:100%; }
    .brand .mark{ font-size:12.5px; padding:4px 7px 3px; }
    h1{ font-size:19px; }
    .tabs{ display:flex; width:100%; }
    .tabs button{ flex:1; padding:9px 8px; font-size:13px; }
    .main{ padding:16px 14px 18px; }
    .sidebar{ padding:12px; }
    .main-head{ gap:10px; }
    .entity-title h2{ font-size:18px; }
    .class-grid{ grid-template-columns:repeat(3, 1fr); gap:8px; }
    .pill-btn{ padding:12px 4px; font-size:14px; }
    .teacher-row{ padding:12px 10px; font-size:14px; }
    .teacher-list{ max-height:50vh; }
    .groups-panel{ padding:16px 14px 18px; }
    .group-card{ padding:12px 14px 14px; }
    .group-class-grid{ grid-template-columns:1fr; }
    table.timetable{ min-width:520px; }
    table.timetable td.period-col{ width:38px; font-size:11px; padding:5px 2px; }
    table.timetable td.period-col span{ font-size:9px; }
    table.timetable td.slot{ min-width:96px; }
    table.timetable thead th{ font-size:11.5px; padding:7px 3px; }
    .entry .subject{ font-size:12.5px; }
    .entry .sub-line{ font-size:10.5px; }
    .cell-inner{ padding:6px 6px; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark">HLHS</span>
      <h1>花蓮高中課表查詢系統</h1>
    </div>
    <div class="meta">
      資料來源：<b>班級手排課</b>（2026-09-07 匯出）<br>
      收錄 <b id="metaClassCount">—</b> 個班級・<b id="metaTeacherCount">—</b> 位教師
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="class" role="tab" aria-selected="true">依班級查詢</button>
    <button class="tab-btn" data-tab="teacher" role="tab" aria-selected="false">依教師查詢</button>
  </div>

  <div class="layout">
    <aside class="panel sidebar">
      <div id="classSidebar">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="classSearch" placeholder="搜尋班級代碼…">
        </div>
        <div id="classGroups"></div>
      </div>
      <div id="teacherSidebar" style="display:none;">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="teacherSearch" placeholder="搜尋教師姓名或代碼…">
        </div>
        <div class="teacher-list" id="teacherList"></div>
      </div>
    </aside>

    <section class="panel main">
      <div class="main-head">
        <div class="entity-title">
          <span class="code-tag" id="entityCode">—</span>
          <h2 id="entityName">請選擇班級</h2>
        </div>
        <div class="stats" id="statChips"></div>
      </div>

      <div class="table-scroll">
        <table class="timetable" id="timetable">
          <thead>
            <tr>
              <th style="width:52px;">節次</th>
              <th data-day="1">星期一</th>
              <th data-day="2">星期二</th>
              <th data-day="3">星期三</th>
              <th data-day="4">星期四</th>
              <th data-day="5">星期五</th>
            </tr>
          </thead>
          <tbody id="timetableBody"></tbody>
        </table>
      </div>

      <div class="legend">
        <span class="sw"><span class="dot own"></span>本人授課 / 主責</span>
        <span class="sw"><span class="dot co"></span>協同教學・研究會・行政會議</span>
        <span class="sw">點選課表中加底線的教師／班級名稱可直接跳轉查詢</span>
      </div>
    </section>
  </div>

  <section class="panel groups-panel">
    <h2 class="groups-heading">分組 / 選修班別對照</h2>
    <p class="groups-sub">部分課程依班級再細分小組上課，任課教師與教室以下表為準；點選班級代碼可直接查看該班完整課表。</p>
    <div id="electiveGroups"></div>
  </section>

  <footer class="foot">花蓮高中課表查詢系統・資料以「班級手排課」原始檔為準，如有調課請以教務處公告為準</footer>
</div>

const teacherByCode = {};
DB.teachers.forEach(t => teacherByCode[t.code] = t.name);
const classCodeSet = new Set(DB.classes.map(c => c.code));

const state = { tab: "class", classCode: null, teacherCode: null };

function gradeOf(code){ return code[0]; }
const gradeLabel = { "1":"一年級", "2":"二年級", "3":"三年級" };
const dayNames = {1:"一",2:"二",3:"三",4:"四",5:"五"};

function renderClassSidebar(filter){
  const el = document.getElementById("classGroups");
  el.innerHTML = "";
  const f = (filter||"").trim();
  ["1","2","3"].forEach(g => {
    const items = DB.classes.filter(c => gradeOf(c.code) === g && c.code.includes(f));
    if(!items.length) return;
    const label = document.createElement("div");
    label.className = "group-label";
    label.textContent = gradeLabel[g];
    el.appendChild(label);
    const grid = document.createElement("div");
    grid.className = "class-grid";
    items.forEach(c => {
      const b = document.createElement("button");
      b.className = "pill-btn" + (state.classCode === c.code ? " active" : "");
      b.textContent = c.code;
      b.onclick = () => selectClass(c.code);
      grid.appendChild(b);
    });
    el.appendChild(grid);
  });
  if(!el.children.length){
    el.innerHTML = '<div class="empty-hint">找不到符合的班級</div>';
  }
}

function renderTeacherSidebar(filter){
  const el = document.getElementById("teacherList");
  el.innerHTML = "";
  const f = (filter||"").trim();
  const items = DB.teachers.filter(t => t.name.includes(f) || t.code.includes(f));
  if(!items.length){
    el.innerHTML = '<div class="empty-hint">找不到符合的教師</div>';
    return;
  }
  items.forEach(t => {
    const b = document.createElement("button");
    b.className = "teacher-row" + (state.teacherCode === t.code ? " active" : "");
    b.innerHTML = '<span>'+t.name+'</span><span class="code">'+t.code+'</span>';
    b.onclick = () => selectTeacher(t.code);
    el.appendChild(b);
  });
}

function selectClass(code){
  state.classCode = code;
  renderClassSidebar(document.getElementById("classSearch").value);
  renderClassView(code);
}
function selectTeacher(code){
  state.teacherCode = code;
  renderTeacherSidebar(document.getElementById("teacherSearch").value);
  renderTeacherView(code);
}

function buildGrid(entries){
  // entries: [{day, start_period, end_period, ...}] possibly overlapping/co-occurring at same day+start
  const grid = {};
  for(let d=1; d<=5; d++){ grid[d] = {}; }
  const byDayStart = {};
  entries.forEach(e => {
    const key = e.day + "-" + e.start_period;
    (byDayStart[key] = byDayStart[key] || []).push(e);
  });
  Object.keys(byDayStart).forEach(key => {
    const [d, sp] = key.split("-").map(Number);
    const group = byDayStart[key];
    const span = Math.max(...group.map(e => e.end_period - e.start_period + 1));
    grid[d][sp] = { span, group };
    for(let p = sp+1; p < sp+span; p++){
      grid[d][p] = { covered:true };
    }
  });
  return grid;
}

function teacherLinkHtml(code, name){
  if(!code || !name) return escapeHtml(name || "");
  return '<span class="link" role="link" tabindex="0" data-goto-teacher="'+escapeHtml(code)+'">'+escapeHtml(name)+'</span>';
}
function classLinkHtml(code, label){
  if(!code || !classCodeSet.has(code)) return escapeHtml(label);
  return '<span class="link" role="link" tabindex="0" data-goto-class="'+escapeHtml(code)+'">'+escapeHtml(label)+'</span>';
}

function entryHtml(e, mode){
  const isCo = e.__co === true;
  const hasCoTeachers = Array.isArray(e.co_teachers) && e.co_teachers.length > 0;
  const lines = [];
  lines.push('<div class="subject">'+escapeHtml(e.subject_name)+'</div>');
  if(mode === "class"){
    const teacherLinks = [];
    if(e.teacher_name) teacherLinks.push(teacherLinkHtml(e.teacher_code, e.teacher_name));
    if(hasCoTeachers) e.co_teachers.forEach(ct => teacherLinks.push(teacherLinkHtml(ct.code, ct.name)));
    let t = teacherLinks.join("、");
    if(e.room_name) t += (t?"・":"") + escapeHtml(e.room_name);
    if(t) lines.push('<div class="sub-line">'+t+'</div>');
    if(hasCoTeachers) lines.push('<span class="tag">協同教學</span>');
  } else {
    let t = e.class_code === "901" ? "全校/科務" : classLinkHtml(e.class_code, e.class_name+"班");
    if(e.room_name) t += "・"+escapeHtml(e.room_name);
    lines.push('<div class="sub-line">'+t+'</div>');
    if(!isCo && hasCoTeachers){
      lines.push('<div class="sub-line">協同：'+e.co_teachers.map(ct => teacherLinkHtml(ct.code, ct.name)).join("、")+'</div>');
    }
  }
  if(isCo) lines.push('<span class="tag">協同/會議</span>');
  return '<div class="entry'+((isCo||hasCoTeachers)?" co":"")+'">'+lines.join("")+'</div>';
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderTable(grid, mode){
  const today = new Date().getDay(); // 0 Sun .. 6 Sat
  document.querySelectorAll('#timetable thead th[data-day]').forEach(th => {
    th.classList.toggle("today", Number(th.dataset.day) === today);
  });
  const body = document.getElementById("timetableBody");
  body.innerHTML = "";
  for(let p=1; p<=8; p++){
    const tr = document.createElement("tr");
    const th = document.createElement("td");
    th.className = "period-col";
    th.innerHTML = "第"+p+"節";
    tr.appendChild(th);
    for(let d=1; d<=5; d++){
      const cellInfo = grid[d][p];
      if(cellInfo && cellInfo.covered) continue;
      const td = document.createElement("td");
      td.className = "slot" + (Number(d) === today ? " today-col" : "");
      if(cellInfo && cellInfo.group){
        if(cellInfo.span > 1) td.rowSpan = cellInfo.span;
        const inner = document.createElement("div");
        inner.className = "cell-inner";
        inner.innerHTML = cellInfo.group.map(e => entryHtml(e, mode)).join("");
        td.appendChild(inner);
      } else {
        td.innerHTML = '<div class="cell-empty"></div>';
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}

function countPeriods(entries){
  let n = 0;
  entries.forEach(e => n += (e.end_period - e.start_period + 1));
  return n;
}

function renderClassView(code){
  const cls = DB.classes.find(c => c.code === code);
  const entries = DB.schedule.filter(r => r.class_code === code);
  document.getElementById("entityCode").textContent = code;
  document.getElementById("entityName").textContent = cls ? cls.name+" 班" : code;
  const teacherSet = new Set(entries.filter(e=>e.teacher_code).map(e=>e.teacher_code));
  const roomSet = new Set(entries.filter(e=>e.room_code).map(e=>e.room_code));
  document.getElementById("statChips").innerHTML =
    '<span class="stat-chip">每週節數 <b>'+countPeriods(entries)+'</b></span>' +
    '<span class="stat-chip">授課教師 <b>'+teacherSet.size+'</b> 位</span>' +
    (roomSet.size ? '<span class="stat-chip">使用專科教室 <b>'+roomSet.size+'</b> 間</span>' : '');
  const grid = buildGrid(entries);
  renderTable(grid, "class");
}

function renderTeacherView(code){
  const t = DB.teachers.find(x => x.code === code);
  const own = DB.schedule.filter(r => r.teacher_code === code).map(e => ({...e, __co:false}));
  const co = DB.schedule.filter(r => {
    if(!r.co_teacher_codes) return false;
    return r.co_teacher_codes.split(",").map(s=>s.trim()).includes(code);
  }).map(e => ({...e, __co:true}));
  const entries = own.concat(co);
  document.getElementById("entityCode").textContent = code;
  document.getElementById("entityName").textContent = t ? t.name+" 教師" : code;
  const classSet = new Set(own.filter(e=>e.class_code!=="901").map(e=>e.class_code));
  const meetingCount = co.length;
  document.getElementById("statChips").innerHTML =
    '<span class="stat-chip">每週授課節數 <b>'+countPeriods(own.filter(e=>e.class_code!=="901"))+'</b></span>' +
    '<span class="stat-chip">授課班級 <b>'+classSet.size+'</b> 班</span>' +
    (meetingCount ? '<span class="stat-chip">協同 / 會議 <b>'+meetingCount+'</b> 場</span>' : '');
  const grid = buildGrid(entries);
  renderTable(grid, "teacher");
}

function switchTab(tab){
  document.querySelectorAll(".tab-btn").forEach(b => {
    const active = b.dataset.tab === tab;
    b.classList.toggle("active", active);
    b.setAttribute("aria-selected", active ? "true" : "false");
  });
  state.tab = tab;
  document.getElementById("classSidebar").style.display = tab === "class" ? "" : "none";
  document.getElementById("teacherSidebar").style.display = tab === "teacher" ? "" : "none";
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    switchTab(btn.dataset.tab);
    if(state.tab === "class") renderClassView(state.classCode);
    else {
      if(!state.teacherCode) state.teacherCode = DB.teachers[0].code;
      renderTeacherSidebar(document.getElementById("teacherSearch").value);
      renderTeacherView(state.teacherCode);
    }
  });
});

function scrollToMain(){
  const main = document.querySelector(".main");
  if(main) main.scrollIntoView({behavior:"smooth", block:"start"});
}
function goToTeacher(code){
  if(!teacherByCode[code]) return;
  switchTab("teacher");
  document.getElementById("teacherSearch").value = "";
  selectTeacher(code);
  scrollToMain();
}
function goToClass(code){
  if(!classCodeSet.has(code)) return;
  switchTab("class");
  document.getElementById("classSearch").value = "";
  selectClass(code);
  scrollToMain();
}

document.addEventListener("click", e => {
  const teacherEl = e.target.closest("[data-goto-teacher]");
  if(teacherEl){ goToTeacher(teacherEl.dataset.gotoTeacher); return; }
  const classEl = e.target.closest("[data-goto-class]");
  if(classEl){ goToClass(classEl.dataset.gotoClass); return; }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const teacherEl = e.target.closest("[data-goto-teacher]");
  if(teacherEl){ e.preventDefault(); goToTeacher(teacherEl.dataset.gotoTeacher); return; }
  const classEl = e.target.closest("[data-goto-class]");
  if(classEl){ e.preventDefault(); goToClass(classEl.dataset.gotoClass); }
});

document.getElementById("classSearch").addEventListener("input", e => renderClassSidebar(e.target.value));
document.getElementById("teacherSearch").addEventListener("input", e => renderTeacherSidebar(e.target.value));

document.getElementById("metaClassCount").textContent = DB.classes.length;
document.getElementById("metaTeacherCount").textContent = DB.teachers.length;

const GROUP_COLOR_VARS = {
  amber: ["--accent", "--accent-soft"],
  teal: ["--ocean", "--ocean-soft"],
  plum: ["--plum", "--plum-soft"],
};

function groupClassCardHtml(cls){
  const rows = (cls.tracks || cls.groups || []).map(t => {
    const detail = escapeHtml(t.teacher) + '<span class="room">・' + escapeHtml(t.room) + '</span>';
    return '<div class="group-track-row"><span class="group-track-chip">' + escapeHtml(t.name) + '</span>' +
           '<span class="group-track-detail">' + detail + '</span></div>';
  }).join("");
  const label = classCodeSet.has(cls.class_code)
    ? '<span class="link class-code-link" role="link" tabindex="0" data-goto-class="' + escapeHtml(cls.class_code) + '">' + escapeHtml(cls.class_code) + '班</span>'
    : '<span class="class-code-link">' + escapeHtml(cls.class_code) + '班</span>';
  return '<div class="group-class-card">' + label + rows + '</div>';
}

function renderElectiveGroups(){
  const el = document.getElementById("electiveGroups");
  const groups = DB.elective_groups || [];
  el.innerHTML = groups.map(group => {
    const [gc, gcSoft] = GROUP_COLOR_VARS[group.color] || GROUP_COLOR_VARS.amber;
    const cards = group.classes.map(groupClassCardHtml).join("");
    return '<div class="group-card" style="--gc:var(' + gc + ');--gc-soft:var(' + gcSoft + ')">' +
      '<div class="group-card-head"><h3 class="group-card-title">' + escapeHtml(group.title) + '</h3>' +
      (group.note ? '<span class="group-card-note">' + escapeHtml(group.note) + '</span>' : '') +
      '</div><div class="group-class-grid">' + cards + '</div></div>';
  }).join("");
}

renderClassSidebar("");
renderTeacherSidebar("");
selectClass(DB.classes[0].code);
renderElectiveGroups();
</script>
